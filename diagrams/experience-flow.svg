<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#efede7"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#090a0b">
    <text x="80" y="90" font-size="46" font-weight="700">THE EXPERIENCE LOOP</text>
    <text x="82" y="128" font-size="17" fill="#686863">The user does not search. The user investigates.</text>
  </g>
  <g stroke="#b9b7af" stroke-width="2" fill="none">
    <path d="M200 310 H430"/><path d="M570 310 H800"/><path d="M940 310 H1170"/><path d="M1310 310 C1450 310 1450 650 1230 650"/>
    <path d="M1100 650 H870"/><path d="M730 650 H500"/><path d="M360 650 C170 650 130 510 200 375"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(90 250)"><text fill="#a17f34" font-size="14">01</text><text x="30" fill="#090a0b" font-size="29">CHOOSE FILM</text><text x="30" y="38" fill="#77766f" font-size="15">enter through something loved</text></g>
    <g transform="translate(450 250)"><text fill="#a17f34" font-size="14">02</text><text x="30" fill="#090a0b" font-size="29">STATE CURIOSITY</text><text x="30" y="38" fill="#77766f" font-size="15">what stayed with you?</text></g>
    <g transform="translate(820 250)"><text fill="#a17f34" font-size="14">03</text><text x="30" fill="#090a0b" font-size="29">AGENT ASSEMBLES</text><text x="30" y="38" fill="#77766f" font-size="15">sources · claims · trail</text></g>
    <g transform="translate(1190 250)"><text fill="#a17f34" font-size="14">04</text><text x="30" fill="#090a0b" font-size="29">READ + THINK</text><text x="30" y="38" fill="#77766f" font-size="15">paced evidence, not an answer dump</text></g>
    <g transform="translate(1110 600)"><text fill="#a17f34" font-size="14">05</text><text x="30" fill="#090a0b" font-size="29">DIRECT + BRANCH</text><text x="30" y="38" fill="#77766f" font-size="15">the main investigation changes</text></g>
    <g transform="translate(750 600)"><text fill="#a17f34" font-size="14">06</text><text x="30" fill="#090a0b" font-size="29">NOTE + CONNECT</text><text x="30" y="38" fill="#77766f" font-size="15">the user creates meaning</text></g>
    <g transform="translate(390 600)"><text fill="#a17f34" font-size="14">07</text><text x="30" fill="#090a0b" font-size="29">CLOSE OR CONTINUE</text><text x="30" y="38" fill="#77766f" font-size="15">world · visual script · dossier · reopen</text></g>
  </g>
  <text x="80" y="835" fill="#77766f" font-family="Arial" font-size="16">Every loop can deepen the current trail or open a new one. There is no artificial completion percentage.</text>
</svg>
